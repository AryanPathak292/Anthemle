<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anthemle</title>
</head>

<body>

    <header>
        <h1>ANTHEMLE</h1>
        <p>Guess the country from its national anthem.</p>
    </header>

    <main>

        <section id="game">
            <h2>Today's Anthem</h2>
<div id="roundStatus">
    <p>New round!</p>
</div>
            <div id="anthemControls">
<button id="playButton">▶ Play Anthem</button></div>

<div id="guessControls">
    <input type="text" id="guessInput" placeholder="Enter your guess">
    <button id="guessButton">Guess</button>
</div>
<div id="attempts">
    <p>Attempts remaining: <span id="attemptsRemaining">6</span></p>
</div>
           <div id="feedback">
    <p id="message"></p>
</div>

<div id="history">
    <h3>Guess History</h3>
    <div id="guessHistory"></div>
</div>
        </section>


    </main>

<script src="js/countries.js"></script>
<script src="js/game.js"></script>
</body>

</html>
